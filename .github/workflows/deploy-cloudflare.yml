name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Cloudflare Pages project if not exists
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create 70015 --production-branch=master

      # Cloudflare lets browsers cache JS/CSS for hours while HTML revalidates every time,
      # so a deploy could pair new HTML with stale scripts. Version the URLs per commit.
      - name: Cache-bust local scripts and styles
        run: sed -i -E 's#((src|href)="(js|css|vendor)/[^"?]+)"#\1?v='"${GITHUB_SHA::8}"'"#g' *.html

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=70015 --branch=master --commit-dirty=true

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <div class="popup__header">
      <span class="popup__logo">70015</span>
    </div>
    <div class="popup__actions">
      <button class="popup__btn popup__btn--primary" id="fullPageBtn">
        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <rect x="2" y="2" width="16" height="16" rx="2"/>
          <path d="M2 8h16M2 14h16"/>
        </svg>
        <span data-i18n="capture_full">Capture full page</span>
      </button>
      <button class="popup__btn" id="regionBtn">
        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <rect x="4" y="4" width="12" height="12" rx="1" stroke-dasharray="3 2"/>
          <path d="M2 2h4M14 2h4M2 18h4M14 18h4"/>
        </svg>
        <span data-i18n="select_region">Select region</span>
      </button>
    </div>
    <div class="popup__status" id="status" hidden>
      <span class="popup__spinner"></span>
      <span id="statusText"></span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Isometric Studio &mdash; 70015</title>
  <meta name="description" content="Browser-based 2.5D Isometric modeling, floorplan extrusion, 3-tone shading, and AI reference creation. No upload.">
  <link rel="canonical" href="https://70015.net/isometric">
  <meta property="og:title" content="Isometric Studio &mdash; 70015">
  <meta property="og:description" content="Browser-based isometric drawing editor with 3D box modeling, angle snapping, and plan extrusion. No upload.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://70015.net/isometric">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/isometric.css">
  <link rel="icon" href="favicon.ico" sizes="32x32 128x128 256x256">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#203848" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1d1c1e" media="(prefers-color-scheme: dark)">
  <script src="js/i18n-head.js"></script>
  <script src="js/theme-head.js"></script>
</head>
<body>
  <div class="app app--wide">
    <header class="header">
      <a class="header__brand" href="./">
        <span class="header__logo" aria-hidden="true">
          <img src="logo.svg" alt="" width="26" height="26">
        </span>
        <div><h1 class="header__title" data-i18n="brand">TOOLS</h1></div>
      </a>
      <div class="header__actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" data-i18n-aria-label="theme">
          <span class="theme-toggle__icon" aria-hidden="true">
            <svg class="theme-toggle__light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
            <svg class="theme-toggle__dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </span>
        </button>
        <button class="menu-btn" id="menuBtn" type="button" aria-label="Open menu" data-i18n-aria-label="menu_open" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
        </button>
      </div>
    </header>

    <nav class="menu" id="menu" aria-hidden="true">
      <div class="menu__inner">
        <div class="menu__header">
          <span class="menu__title">70015</span>
          <button class="menu__close" id="menuClose" type="button" aria-label="Close menu" data-i18n-aria-label="menu_close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 L6 18"/><path d="M6 6 L18 18"/></svg>
          </button>
        </div>
        <div class="menu__grid" id="menuGrid"></div>
      </div>
    </nav>

    <main class="main main--editor">
      <section class="isometric-editor card">
        <!-- 工具栏 -->
        <div class="iso-toolbar">
          <!-- 视图切换 (3D 等距 ↔ 2D 平面) -->
          <div class="iso-toolbar__group">
            <button class="iso-tool-btn iso-tool-btn--text is-active" data-view="iso" type="button" data-i18n="iso_view_3d" data-i18n-title="iso_view_3d">
              3D Iso
            </button>
            <button class="iso-tool-btn iso-tool-btn--text" data-view="plan" type="button" data-i18n="iso_view_2d" data-i18n-title="iso_view_2d">
              2D Plan
            </button>
          </div>

          <span class="iso-sep" aria-hidden="true"></span>

          <!-- 绘图工具 -->
          <div class="iso-toolbar__group">
            <button class="iso-tool-btn" data-tool="select" type="button" data-i18n-title="iso_tool_select" title="Select and move (V)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 3l14 7-6 2-2 6z"/></svg>
            </button>
            <button class="iso-tool-btn is-active" data-tool="box" type="button" data-i18n-title="iso_tool_box" title="3D Box (B)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
            </button>
            <button class="iso-tool-btn" data-tool="plane" type="button" data-i18n-title="iso_tool_plane" title="Plane (P)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
            </button>
            <button class="iso-tool-btn" data-tool="brush" type="button" data-i18n-title="iso_tool_brush" title="3D Texture Brush (D)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18.375 2.625a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4Z"/></svg>
            </button>
            <button class="iso-tool-btn" data-tool="line" type="button" data-i18n-title="iso_tool_line" title="3-Axis Line (L)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="20" x2="20" y2="4"/></svg>
            </button>
            <button class="iso-tool-btn" data-tool="eraser" type="button" data-i18n-title="iso_tool_eraser" title="Eraser (E)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
            </button>
            <button class="iso-tool-btn" data-tool="eyedropper" type="button" data-i18n-title="iso_tool_eyedropper" title="Eyedropper (I / Alt)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m2 22 1-1h3l9-9"/><path d="M12 4.5a2.5 2.5 0 0 1 4 0l3.5 3.5a2.5 2.5 0 0 1 0 4L16 15.5l-7.5-7.5Z"/></svg>
            </button>
          </div>

          <!-- 朝向选择 (Top/Left/Right) -->
          <div class="iso-toolbar__group" id="planeGroup">
            <button class="iso-tool-btn iso-tool-btn--plane is-active" data-plane="top" type="button" data-i18n="iso_plane_top" data-i18n-title="iso_plane_top">Top</button>
            <button class="iso-tool-btn iso-tool-btn--plane" data-plane="left" type="button" data-i18n="iso_plane_left" data-i18n-title="iso_plane_left">Left</button>
            <button class="iso-tool-btn iso-tool-btn--plane" data-plane="right" type="button" data-i18n="iso_plane_right" data-i18n-title="iso_plane_right">Right</button>
          </div>

          <span class="iso-sep" aria-hidden="true"></span>

          <!-- 吸附精度 (允许绘制薄墙 0.25 / 0.1 格) -->
          <div class="iso-toolbar__group" data-i18n-title="iso_step_tip" title="Snap step">
            <span class="iso-step-label" data-i18n="iso_precision">Step</span>
            <select id="snapStepSelect" class="iso-step-select">
              <option value="0.25" selected data-i18n="iso_step_025">0.25 (fine / thin walls)</option>
              <option value="0.5" data-i18n="iso_step_05">0.5 (half)</option>
              <option value="1.0" data-i18n="iso_step_1">1.0 (whole)</option>
              <option value="0.1" data-i18n="iso_step_01">0.1 (nudge)</option>
            </select>
          </div>

          <!-- 画风：平滑 / 像素（放入拼豆作品时自动切到像素） -->
          <div class="iso-toolbar__group" data-i18n-title="iso_style_tip" title="Style">
            <span class="iso-step-label" data-i18n="iso_style">Style</span>
            <button class="iso-tool-btn iso-tool-btn--text is-active" data-style="smooth" type="button" data-i18n="iso_style_smooth">Smooth</button>
            <button class="iso-tool-btn iso-tool-btn--text" data-style="pixel" type="button" data-i18n="iso_style_pixel">Pixel</button>
            <select id="pixelSizeSelect" class="iso-step-select" aria-label="Pixel size" data-i18n-aria-label="iso_pixel_size">
              <option value="2">2px</option>
              <option value="3">3px</option>
              <option value="4" selected>4px</option>
              <option value="6">6px</option>
              <option value="8">8px</option>
            </select>
          </div>

          <span class="iso-sep" aria-hidden="true"></span>

          <!-- 颜色与 3 面明暗 -->
          <label class="iso-prop" data-i18n-title="iso_color" title="Color">
            <span data-i18n="iso_color">Color</span>
            <input type="color" id="fillColor" value="#317fa8">
          </label>

          <div class="iso-shades" id="shadesContainer" data-i18n-title="iso_shades_tip" title="Auto 3-tone shading">
            <div class="iso-shade-box" id="shadeTop"></div>
            <div class="iso-shade-box" id="shadeLeft"></div>
            <div class="iso-shade-box" id="shadeRight"></div>
          </div>

          <label class="iso-prop" data-i18n-title="iso_stroke" title="Stroke">
            <span data-i18n="iso_stroke">Stroke</span>
            <input type="color" id="strokeColor" value="#1f2937">
            <input type="checkbox" id="hasOutline" class="iso-outline-check" checked>
          </label>

          <span class="iso-sep" aria-hidden="true"></span>

          <!-- 控制按钮 -->
          <button class="btn btn--secondary btn--sm" id="undoBtn" type="button" title="Undo (Ctrl+Z)" disabled>&#8694;</button>
          <button class="btn btn--secondary btn--sm" id="redoBtn" type="button" title="Redo (Ctrl+Y)" disabled>&#8695;</button>
          <button class="btn btn--secondary btn--sm is-active" id="snapBtn" type="button" data-i18n="iso_snap" data-i18n-title="iso_snap">Snap</button>
          <button class="btn btn--secondary btn--sm is-active" id="gridBtn" type="button" data-i18n="iso_grid" data-i18n-title="iso_grid">Grid</button>
          <button class="btn btn--secondary btn--sm" id="extrudeBtn" type="button" data-i18n="iso_extrude" data-i18n-title="iso_extrude">Extrude 3D</button>
          <button class="btn btn--secondary btn--sm" id="sampleBtn" type="button" data-i18n="iso_sample" data-i18n-title="iso_sample">Sample</button>
          <button class="btn btn--secondary btn--sm" id="clearBtn" type="button" data-i18n="iso_clear" data-i18n-title="iso_clear">Clear</button>

          <span class="iso-sep" aria-hidden="true"></span>

          <button class="btn btn--secondary btn--sm" id="addBeadsBtn" type="button" data-i18n="iso_add_beads">Add bead work</button>

          <!-- Always shown (enabled while something is selected), so selecting never shifts the canvas -->
          <div class="iso-toolbar__group" id="selGroup">
            <button class="iso-tool-btn iso-tool-btn--text" id="selUp" type="button" data-i18n="iso_sel_up">Raise</button>
            <button class="iso-tool-btn iso-tool-btn--text" id="selDown" type="button" data-i18n="iso_sel_down">Lower</button>
            <button class="iso-tool-btn iso-tool-btn--text" id="selTurn" type="button" data-i18n="iso_sel_turn">Turn</button>
            <button class="iso-tool-btn iso-tool-btn--text" id="selDelete" type="button" data-i18n="iso_sel_delete">Delete</button>
          </div>

          <span class="iso-sep" aria-hidden="true"></span>

          <button class="btn btn--primary btn--sm" id="exportBtn" type="button" data-i18n="iso_export_png">Export PNG</button>
          <button class="btn btn--secondary btn--sm" id="lineartBtn" type="button" data-i18n="iso_export_lineart" data-i18n-title="iso_export_lineart">LineArt</button>
        </div>

        <!-- 画布工作区 -->
        <div class="iso-workspace">
          <div class="iso-canvas-container" id="canvasContainer">
            <canvas class="iso-canvas" id="isoCanvas"></canvas>
            <div class="iso-statusbar" id="statusText">3D Iso | Tool: box | Objects: 0</div>
          </div>
        </div>
      </section>

      <!-- Pick a bead work (from the Bead Pattern page's recent work) to place in the scene -->
      <dialog class="iso-beads-dialog card" id="beadsDialog">
        <form method="dialog">
          <h2 class="iso-beads-dialog__title" data-i18n="iso_beads_title">Add a bead work</h2>
          <div class="iso-beads-dialog__opts">
            <div class="segmented" id="beadsOrient">
              <button class="segmented__btn" data-value="top" type="button" data-i18n="iso_beads_top">Lying flat</button>
              <button class="segmented__btn is-active" data-value="right" type="button" data-i18n="iso_beads_right">Standing (right)</button>
              <button class="segmented__btn" data-value="left" type="button" data-i18n="iso_beads_left">Standing (left)</button>
            </div>
            <label class="iso-beads-dialog__per">
              <span data-i18n="iso_beads_per">Beads per grid cell</span>
              <select id="beadsPer">
                <option value="4">4</option>
                <option value="8" selected>8</option>
                <option value="16">16</option>
              </select>
            </label>
          </div>
          <div class="iso-beads-dialog__list" id="beadsList"></div>
          <p class="iso-beads-dialog__empty" id="beadsEmpty" hidden>
            <span data-i18n="iso_beads_none">No bead works yet. Make one on the Bead Pattern page; it shows up here automatically.</span>
            <a href="beads" data-i18n="t_beads">Bead Pattern</a>
          </p>
          <div class="iso-beads-dialog__actions">
            <button class="btn btn--secondary btn--sm" value="cancel" data-i18n="iso_cancel">Cancel</button>
          </div>
        </form>
      </dialog>
    </main>

    <footer class="footer">
      <p class="footer__text" data-i18n="footer">@70015</p>
    </footer>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/menu-data.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/beads-palettes.js"></script>
  <script src="js/beads-core.js"></script>
  <script src="js/isometric.js"></script>
</body>
</html>
